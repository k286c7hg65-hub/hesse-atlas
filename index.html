<style>
/* ══════════════════════════════════════════════════════════
   黑塞作品图册 · 翻页书
   视觉延续图册本身：米白羊皮纸 + 深墨 + 暖褐
   UI 单主题，不翻转明暗；无装饰性假数据
   ══════════════════════════════════════════════════════════ */
:root{
  --paper:#f0e8d8;
  --paper-deep:#e3d8c0;
  --ink:#2a2620;
  --ink-soft:rgba(42,38,32,.62);
  --accent:#8a6a45;
  --stage:#171512;
  --turn:820ms;
  --ease:cubic-bezier(.42,.05,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--stage);
  color:var(--paper);
  font-family:'Noto Serif SC','Songti SC',Georgia,'Times New Roman',serif;
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
body::before{ /* 舞台微光，避免死黑 */
  content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 30%,rgba(240,232,216,.07),transparent 60%);
}

/* ── 顶栏 ── */
.topbar{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:14px clamp(14px,3vw,32px) 8px;
  position:relative;z-index:6;
}
.brand{font-size:clamp(12px,1.5vw,14px);letter-spacing:.16em;color:rgba(240,232,216,.82)}
.brand small{display:block;font-size:10px;letter-spacing:.24em;color:rgba(240,232,216,.42);margin-top:3px}
.tools{display:flex;gap:8px}
.tool{
  font-family:inherit;font-size:12.5px;letter-spacing:.1em;
  color:rgba(240,232,216,.85);background:rgba(240,232,216,.07);
  border:1px solid rgba(240,232,216,.18);border-radius:3px;
  padding:7px 13px;cursor:pointer;transition:background .25s,border-color .25s;
}
.tool:hover{background:rgba(240,232,216,.14);border-color:rgba(240,232,216,.34)}
.tool:focus-visible,.nav:focus-visible,.thumb:focus-visible,.dot:focus-visible{outline:2px solid var(--paper);outline-offset:2px}

/* ── 舞台与书 ── */
.stage{
  flex:1 1 auto;display:flex;align-items:center;justify-content:center;
  min-height:0;padding:4px clamp(8px,2vw,24px);position:relative;z-index:1;
}
.book-wrap{
  position:relative;
  width:calc(var(--pg-w) * 2);height:var(--pg-h);
  transition:width var(--turn) var(--ease),height var(--turn) var(--ease);
}
body.single .book-wrap{width:var(--pg-w)}
.book-wrap::after{ /* 书落影 */
  content:'';position:absolute;left:2%;right:2%;bottom:-14px;height:22px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(0,0,0,.62),transparent);pointer-events:none;
}
.book{
  position:absolute;inset:0;display:flex;
  border-radius:3px 7px 7px 3px;
  box-shadow:0 26px 54px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.4);
  perspective:2600px;
  background:var(--paper-deep);
}
.slot{position:relative;flex:1 1 50%;overflow:hidden;background:var(--paper-deep)}
.slot.right{border-radius:0 6px 6px 0}
.slot.left{border-radius:4px 0 0 4px}
body.single .slot.left{display:none}
body.single .slot.right{flex:1 1 100%}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.slot.empty{background:var(--paper-deep);box-shadow:inset 0 0 60px rgba(120,100,70,.22)}
.slot.empty::after{ /* 环衬页的压印标记 */
  content:'H H';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:26px;letter-spacing:.5em;text-indent:.5em;color:rgba(120,100,70,.28);
}
.gutter{ /* 书脊 */
  position:absolute;top:0;bottom:0;left:50%;width:2px;transform:translateX(-1px);
  background:linear-gradient(to right,rgba(90,70,45,.34),rgba(255,250,238,.22),rgba(90,70,45,.34));
  pointer-events:none;z-index:4;
}
body.single .gutter{display:none}
.edge{position:absolute;top:0;bottom:0;width:46px;pointer-events:none;z-index:4}
.edge.l{left:0;background:linear-gradient(to right,rgba(70,55,35,.22),transparent)}
.edge.r{right:0;background:linear-gradient(to left,rgba(70,55,35,.22),transparent)}

/* 翻页叶片 */
.leaf{
  position:absolute;top:0;left:50%;width:50%;height:100%;
  transform-style:preserve-3d;z-index:5;
  transition:transform var(--turn) var(--ease);
  will-change:transform;
}
body.single .leaf{left:0;width:100%}
.face{
  position:absolute;inset:0;background:var(--paper);overflow:hidden;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.face.back{transform:rotateY(180deg)}
.face.front{box-shadow:inset -34px 0 44px -34px rgba(60,45,25,.5)}
.face.back{box-shadow:inset 34px 0 44px -34px rgba(60,45,25,.5)}
.leaf.hidden{display:none}

/* 末页版本页 */
.colophon{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;text-align:center;
  padding:10% 12%;color:var(--ink);background:var(--paper);
}
.colophon .mark{font-size:22px;letter-spacing:.4em;color:var(--accent)}
.colophon .rule{width:52px;height:1px;background:rgba(42,38,32,.32)}
.colophon p{font-size:clamp(12.5px,1.6vw,15px);line-height:2.2;color:var(--ink-soft)}
.colophon .sig{font-size:clamp(13px,1.7vw,15.5px);letter-spacing:.2em;color:var(--ink)}

/* ── 底栏 ── */
.bottombar{
  flex:0 0 auto;position:relative;z-index:6;
  padding:10px clamp(12px,3vw,32px) 16px;
  display:flex;flex-direction:column;gap:12px;align-items:center;
}
.thumbs{display:flex;gap:7px;max-width:100%;overflow-x:auto;padding:4px 2px 7px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumb{
  flex:0 0 auto;width:30px;height:42px;border-radius:2px;overflow:hidden;cursor:pointer;
  border:1px solid rgba(240,232,216,.2);background:var(--paper-deep);opacity:.62;
  transition:opacity .3s,border-color .3s,transform .3s;padding:0;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb:hover{opacity:.9}
.thumb.on{opacity:1;border-color:rgba(240,232,216,.85);transform:translateY(-2px)}
body.single .thumbs{display:none}
.controls{display:flex;align-items:center;gap:clamp(12px,3vw,26px)}
.nav{
  width:38px;height:38px;border-radius:50%;cursor:pointer;
  background:rgba(240,232,216,.07);border:1px solid rgba(240,232,216,.2);
  color:rgba(240,232,216,.88);font-size:16px;font-family:inherit;
  display:flex;align-items:center;justify-content:center;transition:background .25s,opacity .25s;
}
.nav:hover{background:rgba(240,232,216,.16)}
.nav[disabled]{opacity:.28;cursor:default}
.dots{display:flex;gap:7px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(240,232,216,.24);border:0;padding:0;cursor:pointer;transition:background .3s,transform .3s}
.dot.on{background:var(--paper);transform:scale(1.35)}
.pageno{font-size:11.5px;letter-spacing:.2em;color:rgba(240,232,216,.6);min-width:78px;text-align:center}
.credit{font-size:10.5px;letter-spacing:.18em;color:rgba(240,232,216,.34)}

/* ── 目录浮层 ── */
.overlay{
  position:fixed;inset:0;z-index:20;background:rgba(12,10,8,.86);
  backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;
  padding:clamp(14px,4vw,40px);opacity:0;visibility:hidden;transition:opacity .32s,visibility .32s;
}
.overlay.on{opacity:1;visibility:visible}
.panel{
  background:var(--paper);color:var(--ink);width:min(920px,100%);max-height:88vh;overflow-y:auto;
  border-radius:4px;padding:clamp(20px,3.4vw,38px);box-shadow:0 30px 70px rgba(0,0,0,.6);
}
.panel h2{font-size:clamp(17px,2.4vw,22px);letter-spacing:.14em;font-weight:600;margin-bottom:5px}
.panel .sub{font-size:11.5px;letter-spacing:.2em;color:var(--ink-soft);margin-bottom:20px}
.toc{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
@media (min-width:700px){ .toc{grid-template-columns:repeat(3,1fr)} }
.toc-item{
  display:flex;flex-direction:column;gap:8px;cursor:pointer;border:0;background:none;
  padding:0;text-align:left;font-family:inherit;color:inherit;
}
.toc-item img{width:100%;border-radius:2px;border:1px solid rgba(42,38,32,.2);display:block;transition:transform .3s,border-color .3s}
.toc-item:hover img{transform:translateY(-3px);border-color:rgba(42,38,32,.5)}
.toc-item .idx{font-size:10.5px;letter-spacing:.22em;color:var(--accent)}
.toc-item .name{font-size:13px;letter-spacing:.06em}
.panel .foot{margin-top:22px;padding-top:14px;border-top:1px solid rgba(42,38,32,.16);font-size:11px;letter-spacing:.14em;color:var(--ink-soft)}

/* ── 放大阅读 ── */
.viewer{
  position:fixed;inset:0;z-index:30;background:rgba(10,9,7,.96);
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity .28s,visibility .28s;
  touch-action:none;overflow:hidden;
}
.viewer.on{opacity:1;visibility:visible}
.viewer img{
  position:absolute;top:0;left:0;max-width:none;max-height:none;
  transform-origin:0 0;will-change:transform;cursor:grab;user-select:none;
}
.viewer.dragging img{cursor:grabbing}
.viewer .vbar{
  position:absolute;left:50%;transform:translateX(-50%);bottom:18px;max-width:calc(100vw - 24px);
  display:flex;align-items:center;gap:10px;background:rgba(20,17,13,.86);flex-wrap:nowrap;white-space:nowrap;
  border:1px solid rgba(240,232,216,.18);border-radius:3px;padding:7px 12px;
  font-size:11.5px;letter-spacing:.12em;color:rgba(240,232,216,.8);
}
.viewer .vbar button{
  font-family:inherit;font-size:12px;color:rgba(240,232,216,.85);
  background:rgba(240,232,216,.08);border:1px solid rgba(240,232,216,.2);border-radius:2px;
  padding:5px 9px;cursor:pointer;
}
.viewer .vbar button:hover{background:rgba(240,232,216,.18)}
.viewer .hint{opacity:.55;font-size:10.5px}
@media (max-width:700px){ .viewer .hint{display:none} .viewer .vbar{gap:7px;padding:6px 9px} }
.vclose{
  position:absolute;top:14px;right:16px;width:38px;height:38px;border-radius:50%;
  background:rgba(240,232,216,.08);border:1px solid rgba(240,232,216,.2);
  color:rgba(240,232,216,.9);font-size:17px;cursor:pointer;font-family:inherit;
}
.vprev,.vnext{
  position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;
  background:rgba(240,232,216,.08);border:1px solid rgba(240,232,216,.2);
  color:rgba(240,232,216,.9);font-size:17px;cursor:pointer;font-family:inherit;
}
.vprev{left:14px}.vnext{right:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── 打印：每页一图 ── */
.printall{display:none}
@media print{
  body{background:#fff;overflow:visible;display:block}
  body::before,.topbar,.bottombar,.overlay,.viewer,.stage{display:none!important}
  .printall{display:block}
  .printall img{width:100%;page-break-after:always;display:block}
}

/* ── 断点 ── */
@media (max-width:1023px){
  body{--pg-w:min(94vw,560px);--pg-h:calc(var(--pg-w)*1.4142)}
}
@media (min-width:1024px){
  body{--pg-h:min(82vh,860px);--pg-w:calc(var(--pg-h)*.70758)}
}
@media (prefers-reduced-motion:reduce){
  :root{--turn:1ms}
}
</style>

const VIEWS_SPREAD = [[null,0],[1,2],[3,4],[5,'colophon']];
const VIEWS_SINGLE = [[null,0],[null,1],[null,2],[null,3],[null,4],[null,5]];

const $ = s => document.querySelector(s);
const book = $('#book'), slotL = $('#slotL'), slotR = $('#slotR');
const leaf = $('#leaf'), leafF = $('#leafF'), leafB = $('#leafB');
const dotsEl = $('#dots'), thumbsEl = $('#thumbs'), tocEl = $('#toc');
const pageno = $('#pageno'), live = $('#live');
const overlay = $('#overlay'), viewer = $('#viewer'), vimg = $('#vimg');

let SPREAD = matchMedia('(min-width:1024px) and (min-height:560px)').matches;
let VIEWS = SPREAD ? VIEWS_SPREAD : VIEWS_SINGLE;
let cur = 0, flipping = false, animTimer = null;

/* 页码显示：单页模式 1/5，跨页模式 1-2/5 */
function viewLabel(view){
  if(view === 0) return '封面';
  const v = VIEWS[view];
  const nums = [v[0], v[1]].filter(x => typeof x === 'number' && x > 0);
  if(!nums.length) return '版本页';
  const tail = v[1] === 'colophon' ? ' · 版本页' : '';
  const span = nums.length === 2 ? nums[0] + '-' + nums[1] : String(nums[0]);
  return span + ' / ' + (PAGES.length - 1) + tail;
}

/* 渲染一格内容 */
function fillSlot(el, p, opts){
  opts = opts || {};
  el.classList.toggle('empty', p === null);
  if(p === 'colophon'){
    el.innerHTML = '<div class="colophon">' +
      '<div class="mark">H H</div><div class="rule"></div>' +
      '<p>黑塞作品图册 · 作者 · 作品 · 时代 · 主题 · 当代解读</p>' +
      '<p>文学是一场通向内心的旅程，也是回家的路。</p>' +
      '<div class="rule"></div>' +
      '<div class="sig">仅供学习使用 · 制作者 Ariste</div></div>';
    return;
  }
  if(p === null){ el.innerHTML = ''; return; }
  const meta = PAGES[p];
  el.innerHTML = '<img src="' + meta.src + '" alt="' + meta.name + '"' +
    (PH[meta.src.split('/').pop().replace('.webp','')]
      ? ' style="background-image:url(' + PH[meta.src.split('/').pop().replace('.webp','')] + ');background-size:cover;background-position:center"'
      : '') + '>';
}

function fillFace(el, p){
  if(p === 'colophon' || p === null){ el.style.background = 'var(--paper)'; el.innerHTML = ''; return; }
  const meta = PAGES[p];
  const key = meta.src.split('/').pop().replace('.webp','');
  el.innerHTML = '<img src="' + meta.src + '" alt="' + meta.name + '"' +
    (PH[key] ? ' style="background-image:url(' + PH[key] + ');background-size:cover;background-position:center"' : '') + '>';
}

function render(view, silent){
  const v = VIEWS[view];
  fillSlot(slotL, v[0]);
  fillSlot(slotR, v[1]);
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on', i===view));
  document.querySelectorAll('.thumb').forEach((t,i)=>t.classList.toggle('on', i===view));
  pageno.textContent = viewLabel(view);
  $('#btnPrev').disabled = view === 0;
  $('#btnNext').disabled = view === VIEWS.length-1;
  if(!silent) live.textContent = pageno.textContent;
}

/* 翻页 */
function go(dir){
  const dst = cur + dir;
  if(flipping || dst < 0 || dst >= VIEWS.length) return;
  flipping = true;

  const from = VIEWS[cur], to = VIEWS[dst];
  fillSlot(slotL, dir > 0 ? from[0] : to[0]);
  fillSlot(slotR, dir > 0 ? to[1] : from[1]);

  // 叶片两面
  if(dir > 0){ fillFace(leafF, from[1]); fillFace(leafB, to[0]); }
  else { fillFace(leafF, to[1]); fillFace(leafB, from[0]); }

  leaf.classList.remove('hidden');
  leaf.style.transition = 'none';
  leaf.style.transform = dir > 0 ? 'rotateY(0deg)' : 'rotateY(-180deg)';
  void leaf.offsetWidth;                       // 强制回流
  leaf.style.transition = '';

  requestAnimationFrame(()=>{
    leaf.style.transform = dir > 0 ? 'rotateY(-180deg)' : 'rotateY(0deg)';
  });

  const finish = ()=>{
    clearTimeout(animTimer);
    leaf.removeEventListener('transitionend', finish);
    leaf.classList.add('hidden');
    cur = dst;
    render(cur);
    flipping = false;
  };
  leaf.addEventListener('transitionend', finish);
  animTimer = setTimeout(finish, 1200);         // 安全网
}

/* 跳页（目录/缩略图/圆点）：直接切换，不做翻页动画 */
function jump(i){
  if(flipping || i === cur) return;
  cur = Math.max(0, Math.min(VIEWS.length - 1, i));
  render(cur);
  closeToc();
}

/* ── 构建底部导航 ── */
VIEWS.forEach((v,i)=>{
  const d = document.createElement('button');
  d.className = 'dot'; d.type = 'button';
  d.setAttribute('aria-label', '前往 ' + (i === 0 ? '封面' : i));
  d.addEventListener('click', ()=>jump(i));
  dotsEl.appendChild(d);
});
PAGES.forEach((p,i)=>{
  const b = document.createElement('button');
  b.className = 'thumb'; b.type = 'button';
  b.title = p.name;
  b.innerHTML = '<img src="' + p.thumb + '" alt="' + p.name + '">';
  b.addEventListener('click', ()=>jump(SPREAD ? Math.min(VIEWS.length-1, Math.ceil(i/2)) : i));
  thumbsEl.appendChild(b);
});

/* ── 目录 ── */
PAGES.forEach((p,i)=>{
  const it = document.createElement('button');
  it.className = 'toc-item'; it.type = 'button';
  it.innerHTML = '<img src="' + p.thumb + '" alt="' + p.name + '">' +
    '<span class="idx">' + (i === 0 ? 'COVER' : '0' + i) + '</span>' +
    '<span class="name">' + p.name + '</span>';
  it.addEventListener('click', ()=>jump(SPREAD ? Math.min(VIEWS.length-1, Math.ceil(i/2)) : i));
  tocEl.appendChild(it);
});
function openToc(){ overlay.classList.add('on'); }
function closeToc(){ overlay.classList.remove('on'); }
$('#btnToc').addEventListener('click', openToc);
overlay.addEventListener('click', e=>{ if(e.target === overlay) closeToc(); });
$('#btnPrint').addEventListener('click', ()=>window.print());

/* ── 放大阅读 ── */
let scale = 1, tx = 0, ty = 0, vIndex = 0;
function applyT(){ vimg.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')'; $('#vlevel').textContent = Math.round(scale*100) + '%'; }
function fit(){
  const iw = vimg.naturalWidth || 1055, ih = vimg.naturalHeight || 1491;
  const availH = window.innerHeight - 110;          // 给底部控制条留位
  const s = Math.min(window.innerWidth / iw, availH / ih) * 0.98;
  scale = s; tx = (window.innerWidth - iw*s)/2; ty = (availH - ih*s)/2 + 8;
  applyT();
}
function openViewer(i){
  vIndex = i;
  const p = PAGES[i];
  vimg.style.backgroundImage = PH[p.src.split('/').pop().replace('.webp','')] ? 'url(' + PH[p.src.split('/').pop().replace('.webp','')] + ')' : '';
  vimg.style.backgroundSize = 'cover';
  vimg.src = p.src;
  vimg.onload = fit;
  if(vimg.complete) fit();
  viewer.classList.add('on');
  closeToc();
}
function closeViewer(){ viewer.classList.remove('on'); }
function stepViewer(dir){
  const n = (vIndex + dir + PAGES.length) % PAGES.length;
  openViewer(n);
}
function zoomAt(cx, cy, factor){
  const ns = Math.max(0.2, Math.min(8, scale * factor));
  const k = ns / scale;
  tx = cx - k * (cx - tx); ty = cy - k * (cy - ty); scale = ns;
  applyT();
}
$('#vclose').addEventListener('click', closeViewer);
$('#vprev').addEventListener('click', e=>{ e.stopPropagation(); stepViewer(-1); });
$('#vnext').addEventListener('click', e=>{ e.stopPropagation(); stepViewer(1); });
$('#vin').addEventListener('click', ()=>zoomAt(window.innerWidth/2, window.innerHeight/2, 1.35));
$('#vout').addEventListener('click', ()=>zoomAt(window.innerWidth/2, window.innerHeight/2, 1/1.35));
$('#vfit').addEventListener('click', fit);
viewer.addEventListener('wheel', e=>{
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 1/1.12);
}, {passive:false});
viewer.addEventListener('dblclick', e=>{
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, scale > 1.6 ? 1/scale : 2.2/scale);
});
/* 拖拽 + 双指 */
let dragging = false, lx = 0, ly = 0, pinch = null;
viewer.addEventListener('pointerdown', e=>{
  if(e.target.tagName !== 'IMG') return;
  dragging = true; lx = e.clientX; ly = e.clientY; viewer.classList.add('dragging');
  vimg.setPointerCapture(e.pointerId);
});
viewer.addEventListener('pointermove', e=>{
  if(!dragging) return;
  tx += e.clientX - lx; ty += e.clientY - ly; lx = e.clientX; ly = e.clientY; applyT();
});
viewer.addEventListener('pointerup', ()=>{ dragging = false; viewer.classList.remove('dragging'); });
viewer.addEventListener('touchstart', e=>{
  if(e.touches.length === 2){
    const [a,b] = e.touches;
    pinch = {d: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY),
             cx:(a.clientX+b.clientX)/2, cy:(a.clientY+b.clientY)/2, s: scale};
  }
}, {passive:true});
viewer.addEventListener('touchmove', e=>{
  if(e.touches.length === 2 && pinch){
    e.preventDefault();
    const [a,b] = e.touches;
    const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    const k = (pinch.s * d / pinch.d) / scale;
    zoomAt(pinch.cx, pinch.cy, k);
  }
}, {passive:false});

/* ── 主交互 ── */
$('#btnNext').addEventListener('click', ()=>go(1));
$('#btnPrev').addEventListener('click', ()=>go(-1));
book.addEventListener('click', e=>{
  if(e.target.closest('.leaf') && flipping) return;
  if(e.target.tagName === 'IMG'){                       // 点页面 → 放大
    const src = e.target.getAttribute('src') || '';
    const m = src.match(/p(\d)\.webp/);
    openViewer(m ? parseInt(m[1],10) : 0);
  }
});
book.addEventListener('keydown', e=>{
  if(e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); go(1); }
  if(e.key === 'ArrowLeft'){ e.preventDefault(); go(-1); }
});
document.addEventListener('keydown', e=>{
  if(viewer.classList.contains('on')){
    if(e.key === 'Escape') closeViewer();
    if(e.key === 'ArrowRight') stepViewer(1);
    if(e.key === 'ArrowLeft') stepViewer(-1);
    if(e.key === '0' || e.key.toLowerCase() === 'f') fit();
    return;
  }
  if(e.key === 'Escape') closeToc();
  if(e.key === 'ArrowRight') go(1);
  if(e.key === 'ArrowLeft') go(-1);
  if(e.key === ' '){ e.preventDefault(); go(1); }
  if(e.key.toLowerCase() === 'c') openToc();
});
/* 触摸滑动（翻页） */
let tsx = 0, tsy = 0, swiping = false;
document.addEventListener('touchstart', e=>{
  if(e.touches.length !== 1) return;
  tsx = e.touches[0].clientX; tsy = e.touches[0].clientY; swiping = true;
}, {passive:true});
document.addEventListener('touchend', e=>{
  if(!swiping || viewer.classList.contains('on') || overlay.classList.contains('on')) return;
  swiping = false;
  const dx = e.changedTouches[0].clientX - tsx;
  const dy = e.changedTouches[0].clientY - tsy;
  if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)){ dx < 0 ? go(1) : go(-1); }
}, {passive:true});

/* ── 模式切换 ── */
const mq = matchMedia('(min-width:1024px) and (min-height:560px)');
function setMode(){
  const next = mq.matches;
  const page = SPREAD ? (cur === 0 ? 0 : (cur*2)) : 0;
  SPREAD = next;
  VIEWS = SPREAD ? VIEWS_SPREAD : VIEWS_SINGLE;
  document.body.classList.toggle('single', !SPREAD);
  cur = Math.max(0, Math.min(VIEWS.length - 1, SPREAD ? Math.ceil(page/2) : Math.min(5, page)));
  render(cur, true);
}
mq.addEventListener('change', setMode);

/* ── 预加载 ── */
PAGES.forEach(p=>{ const i = new Image(); i.src = p.src; });
$('#printall').innerHTML = PAGES.map(p=>'<img src="' + p.src + '" alt="' + p.name + '">').join('');

document.body.classList.toggle('single', !SPREAD);
render(0, true);
</script>
