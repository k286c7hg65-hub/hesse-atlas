/* ══════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════ */
:root{
  --paper:#f0e8d8;
  --paper-deep:#e3d8c0;
  --ink:#2a2620;
  --ink-soft:rgba(42,38,32,.62);
  --accent:#8a6a45;
  --stage:#171512;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--stage);color:var(--paper);
  font-family:'Noto Serif SC','Songti SC',Georgia,'Times New Roman',serif;
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 28%,rgba(240,232,216,.07),transparent 62%);
}

/* ── 顶栏 ── */
.topbar{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  gap:12px;padding:12px clamp(12px,3vw,30px) 6px;position:relative;z-index:6;
}
.brand{font-size:clamp(12px,1.5vw,14px);letter-spacing:.16em;color:rgba(240,232,216,.84)}
.brand small{display:block;font-size:10px;letter-spacing:.24em;color:rgba(240,232,216,.42);margin-top:3px}
.tool{
  font-family:inherit;font-size:12.5px;letter-spacing:.1em;
  color:rgba(240,232,216,.86);background:rgba(240,232,216,.07);
  border:1px solid rgba(240,232,216,.18);border-radius:3px;
  padding:8px 15px;cursor:pointer;transition:background .25s,border-color .25s;min-height:34px;
}
.tool:hover{background:rgba(240,232,216,.14);border-color:rgba(240,232,216,.34)}
.tool:focus-visible,.nav:focus-visible,.thumb:focus-visible,.dot:focus-visible{outline:2px solid var(--paper);outline-offset:2px}

/* ── 舞台 ── */
.stage{
  flex:1 1 auto;display:flex;align-items:center;justify-content:center;
  min-height:0;padding:2px clamp(6px,1.6vw,18px);position:relative;z-index:1;
}
.book-wrap{position:relative}
#bookShadow{
  position:absolute;pointer-events:none;border-radius:50%;height:18px;
  background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);
  transition:left .22s ease,width .22s ease,top .22s ease;z-index:0;
}
#book{position:relative;width:100%;height:100%;min-width:0 !important;min-height:0 !important}

/* 书页内容 */
.book-page{background:var(--paper);overflow:hidden}
.book-page img{
  width:100%;height:100%;object-fit:cover;display:block;
  background-size:cover;background-position:center;background-color:var(--paper-deep);
}
.book-page.cover img{border-radius:2px 5px 5px 2px}
.colophon{
  width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;text-align:center;
  padding:10% 12%;color:var(--ink);background:var(--paper);
}
.colophon .mark{font-size:20px;letter-spacing:.42em;color:var(--accent)}
.colophon .rule{width:50px;height:1px;background:rgba(42,38,32,.3)}
.colophon p{font-size:clamp(12px,1.5vw,15px);line-height:2.1;color:var(--ink-soft)}
.colophon .sig{font-size:clamp(12.5px,1.6vw,15px);letter-spacing:.2em;color:var(--ink)}

/* ── 底栏 ── */
.bottombar{
  flex:0 0 auto;position:relative;z-index:6;
  padding:8px clamp(10px,3vw,30px) calc(12px + var(--safe-b));
  display:flex;flex-direction:column;gap:10px;align-items:center;
}
.thumbs{display:flex;gap:7px;max-width:100%;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.thumbs::-webkit-scrollbar{display:none}
.thumb{
  flex:0 0 auto;width:30px;height:42px;border-radius:2px;overflow:hidden;cursor:pointer;
  border:1px solid rgba(240,232,216,.2);background:var(--paper-deep);opacity:.62;
  transition:opacity .3s,border-color .3s,transform .3s;padding:0;
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.vp{display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:.2em;color:rgba(42,38,32,.6);font-family:inherit}
.thumb:hover{opacity:.9}
.thumb.on{opacity:1;border-color:rgba(240,232,216,.85);transform:translateY(-2px)}
.controls{display:flex;align-items:center;gap:clamp(16px,3.2vw,32px)}
.nav{
  width:40px;height:40px;border-radius:50%;cursor:pointer;
  background:rgba(240,232,216,.07);border:1px solid rgba(240,232,216,.2);
  color:rgba(240,232,216,.88);font-size:16px;font-family:inherit;
  display:flex;align-items:center;justify-content:center;transition:background .25s,opacity .25s;
}
.nav:hover{background:rgba(240,232,216,.16)}
.nav[disabled]{opacity:.28;cursor:default}
.dots{display:flex;gap:7px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(240,232,216,.24);border:0;padding:0;cursor:pointer;transition:background .3s,transform .3s}
.dot.on{background:var(--paper);transform:scale(1.35)}
.pageno{font-size:11.5px;letter-spacing:.18em;color:rgba(240,232,216,.62);min-width:86px;text-align:center}
.credit{font-size:10.5px;letter-spacing:.16em;color:rgba(240,232,216,.34);text-align:center}

/* ── 目录 ── */
.overlay{
  position:fixed;inset:0;z-index:20;background:rgba(12,10,8,.86);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;
  padding:clamp(12px,4vw,40px);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;
}
.overlay.on{opacity:1;visibility:visible}
.panel{
  background:var(--paper);color:var(--ink);width:min(940px,100%);max-height:86vh;overflow-y:auto;
  border-radius:4px;padding:clamp(18px,3.2vw,36px);box-shadow:0 30px 70px rgba(0,0,0,.6);
}
.panel h2{font-size:clamp(17px,2.4vw,22px);letter-spacing:.14em;font-weight:600;margin-bottom:5px}
.panel .sub{font-size:11.5px;letter-spacing:.18em;color:var(--ink-soft);margin-bottom:18px}
.toc{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media (min-width:700px){ .toc{grid-template-columns:repeat(3,1fr);gap:16px} }
.toc-item{display:flex;flex-direction:column;gap:7px;cursor:pointer;border:0;background:none;padding:0;text-align:left;font-family:inherit;color:inherit}
.toc-item img{width:100%;border-radius:2px;border:1px solid rgba(42,38,32,.2);display:block;transition:transform .3s,border-color .3s}
.toc-item:hover img{transform:translateY(-3px);border-color:rgba(42,38,32,.5)}
.toc-item .idx{font-size:10.5px;letter-spacing:.22em;color:var(--accent)}
.toc-item .name{font-size:13px;letter-spacing:.06em}
.panel .hint{font-size:11.5px;line-height:2;color:var(--ink-soft);margin-top:16px}
.panel .foot{margin-top:18px;padding-top:13px;border-top:1px solid rgba(42,38,32,.16);font-size:11px;letter-spacing:.12em;color:var(--ink-soft)}

/* ── 放大阅读 ── */
.viewer{
  position:fixed;inset:0;z-index:30;background:rgba(10,9,7,.96);
  display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity .26s,visibility .26s;touch-action:none;overflow:hidden;
}
.viewer.on{opacity:1;visibility:visible}
.viewer img{position:absolute;top:0;left:0;max-width:none;max-height:none;transform-origin:0 0;will-change:transform;cursor:grab;user-select:none}
.viewer.dragging img{cursor:grabbing}
.viewer .vbar{
  position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe-b));
  display:flex;align-items:center;gap:9px;background:rgba(20,17,13,.88);
  border:1px solid rgba(240,232,216,.18);border-radius:3px;padding:7px 12px;
  font-size:11.5px;letter-spacing:.1em;color:rgba(240,232,216,.82);white-space:nowrap;max-width:calc(100vw - 20px);
}
.viewer .vbar button{
  font-family:inherit;font-size:12px;color:rgba(240,232,216,.86);
  background:rgba(240,232,216,.08);border:1px solid rgba(240,232,216,.2);border-radius:2px;
  padding:6px 10px;cursor:pointer;min-height:30px;
}
.viewer .vbar button:hover{background:rgba(240,232,216,.18)}
.viewer .hint{opacity:.55;font-size:10.5px}
.vclose{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;width:40px;height:40px;border-radius:50%;
  background:rgba(240,232,216,.08);border:1px solid rgba(240,232,216,.2);color:rgba(240,232,216,.9);font-size:17px;cursor:pointer;font-family:inherit}
.vprev,.vnext{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;
  background:rgba(240,232,216,.08);border:1px solid rgba(240,232,216,.2);color:rgba(240,232,216,.9);font-size:17px;cursor:pointer;font-family:inherit}
.vprev{left:10px}.vnext{right:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── 分端适配 ── */
/* 手机竖屏 */
@media (max-width:600px){
  .brand small{display:none}
  .thumb{width:26px;height:36px}
  .nav{width:44px;height:44px;font-size:17px}
  .pageno{min-width:74px;font-size:11px}
  .credit{font-size:10px;letter-spacing:.12em}
  .viewer .hint{display:none}
}
/* 小平板 */
@media (min-width:601px) and (max-width:900px){
  .thumb{width:28px;height:39px}
}
/* 桌面：顶栏更松、提示更全 */
@media (min-width:1200px){
  .topbar{padding:16px clamp(16px,3vw,34px) 8px}
  .bottombar{gap:12px}
}
/* 横屏矮屏（手机横放）：压缩上下栏，把高度让给书 */
@media (max-height:520px){
  .topbar{padding:4px 12px 0}
  .brand{font-size:11px;letter-spacing:.12em}
  .brand small{display:none}
  .tool{padding:5px 11px;font-size:11.5px;min-height:28px}
  .stage{padding:0 6px}
  .thumbs{display:none}
  .bottombar{flex-direction:row;align-items:center;justify-content:center;gap:10px;padding:2px 10px calc(4px + var(--safe-b));position:relative}
  .nav{width:32px;height:32px;font-size:15px}
  .pageno{min-width:58px;font-size:10px}
  .credit{position:absolute;right:10px;font-size:9px;letter-spacing:.08em;margin:0}
}
@media (prefers-reduced-motion:reduce){
  .overlay,.viewer{transition:none}
}
</style>

const COUNT = TOTAL + 1;                    // 共 7 页
const RATIO = 1055 / 1491;                  // 单页宽高比

const $ = s => document.querySelector(s);
const bookEl = $('#book'), live = $('#live');

/* ── 建页（图片全部懒加载：先出模糊占位，靠近才拉原图）── */
function pageHTML(i){
  if(i === LAST){
    return '<div class="colophon"><div class="mark">H H</div><div class="rule"></div>' +
      '<p>黑塞作品图册 · 作者 · 作品 · 时代 · 主题 · 当代解读</p>' +
      '<p>文学是一场通向内心的旅程，也是回家的路。</p>' +
      '<div class="rule"></div><div class="sig">仅供学习使用 · 制作者 Ariste</div></div>';
  }
  const key = PAGES[i].src.split('/').pop().replace('.webp','');
  const bg = PH[key] ? 'background-image:url(' + PH[key] + ')' : '';
  return '<img data-src="' + PAGES[i].src + '" alt="' + PAGES[i].name + '" style="' + bg + '">';
}
PAGES.concat([{name:'版本页'}]).forEach((p,i)=>{
  const d = document.createElement('div');
  d.className = 'book-page' + (i === 0 ? ' cover' : '');
  d.dataset.idx = i;
  d.innerHTML = pageHTML(i);
  bookEl.appendChild(d);
});

/* ── 懒加载：当前页 ±1 预热 ── */
function loadImg(i){
  if(i < 0 || i > LAST) return;
  const el = bookEl.querySelector('.book-page[data-idx="' + i + '"] img[data-src]');
  if(el){ el.src = el.dataset.src; el.removeAttribute('data-src'); }
}
let warmed = new Set();
function warm(cur){
  for(let i = cur - 1; i <= cur + 2; i++){
    if(i < 0 || i > LAST || warmed.has(i)) continue;
    warmed.add(i); loadImg(i);
  }
}

/* ── 舞台尺寸：给引擎一块「区块」，页面尺寸由引擎 stretch 自算 ──
   引擎判定单页/对开的规则是 blockW < 2*minWidth → 单页；
   所以用 MIN_W 当双页门槛：够宽（≥2*MIN_W）且是横向才给对开，否则给「单页宽」。── */
const stageEl = document.querySelector('.stage');
const wrapEl  = document.getElementById('bookWrap');
const shadowEl = document.getElementById('bookShadow');
const BASE_W = 550, BASE_H = 550 / RATIO;   // 单页基准（比例同原图）
const MIN_W = 400, MAX_W = 900;              // = 引擎 settings.minWidth / maxWidth
const stageBox = () => {
  const cs = getComputedStyle(stageEl);
  return {
    w: stageEl.clientWidth  - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight),
    h: stageEl.clientHeight - parseFloat(cs.paddingTop)  - parseFloat(cs.paddingBottom)
  };
};
function sizeStage(){
  const { w, h } = stageBox();
  if(w <= 0 || h <= 0) return;
  const twoUp = w >= 2 * MIN_W && w / h >= 1.02;   // 宽屏且横向 → 对开
  wrapEl.style.width  = Math.floor(twoUp ? w : Math.min(w, h * RATIO, 2 * MIN_W - 2)) + 'px';
  wrapEl.style.height = Math.floor(h) + 'px';
  syncShadow();
}
/* 投影跟随引擎实际书页矩形（对开时区块可能宽于书本）*/
function syncShadow(){
  if(!pageFlip || !pageFlip.getBoundsRect) return;
  let b;
  try{ b = pageFlip.getBoundsRect(); }catch(e){ return; }
  if(!b) return;
  shadowEl.style.left  = (b.left + b.width * 0.03) + 'px';
  shadowEl.style.width = (b.width * 0.94) + 'px';
  shadowEl.style.top   = (b.top + b.height + 5) + 'px';
}

/* ── 翻页引擎 ── */
let pageFlip = null;
function initFlip(){
  const FlipCls = window.StPageFlip || (window.St && window.St.PageFlip);
  if(!FlipCls){ console.warn('StPageFlip 未加载'); return; }
  pageFlip = new FlipCls(bookEl, {
    width: BASE_W, height: BASE_H,          // 单页基准尺寸（比例同原图）
    size: 'stretch',
    minWidth: MIN_W, maxWidth: MAX_W,       // MIN_W 同时是「单页 / 对开」的判定门槛
    minHeight: 240, maxHeight: 1400,
    drawShadow: true,
    flippingTime: 780,
    usePortrait: true,                        // 窄屏自动单页
    startZIndex: 0,
    autoSize: true,
    maxShadowOpacity: 0.32,
    showCover: true,                          // 封面单独成页（硬壳）
    mobileScrollSupport: false,
    swipeDistance: 45,
    showPageCorners: true,                    // 可拖页角翻页
    disableFlipByClick: false,                // 引擎内部 flipPrev 依赖此项为 false；点击由我们自己接管（见 capture 监听）
    useMouseEvents: true
  });
  pageFlip.loadFromHTML(bookEl.querySelectorAll('.book-page'));
  window.pageFlip = pageFlip;                       // 调试/维护用句柄

  pageFlip.on('flip', e => { cur = e.data; warm(cur); render(); syncShadow(); });
  pageFlip.on('changeState', e => { if(e.data === 'read'){ warm(cur); syncShadow(); } });
  pageFlip.on('changeOrientation', () => { render(); syncShadow(); });
  setTimeout(() => { cur = pageFlip.getCurrentPageIndex(); render(); syncShadow(); }, 400);
}

/* ── 状态与 UI ── */
let cur = 0;
const isLandscape = () => (pageFlip && pageFlip.getOrientation && pageFlip.getOrientation() === 'landscape');

function label(){
  if(cur === 0) return '封面';
  if(cur === LAST) return '版本页';
  if(isLandscape()){
    if(cur >= TOTAL) return TOTAL + ' / ' + TOTAL;
    return cur + '-' + (cur + 1) + ' / ' + TOTAL;
  }
  return cur + ' / ' + TOTAL;
}
function render(){
  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('on', i === cur));
  document.querySelectorAll('.thumb').forEach((t,i)=>t.classList.toggle('on', i === cur));
  const span = isLandscape() ? 2 : 1;                  // 对开一次走两页
  const atEnd = cur + span > COUNT - 1;
  $('#btnPrev').disabled = cur <= 0;
  $('#btnNext').disabled = atEnd;
  const txt = label();
  $('#pageno').textContent = txt;
  live.textContent = txt;
}

/* 底部导航 */
const thumbsEl = $('#thumbs'), dotsEl = $('#dots');
for(let i = 0; i < COUNT; i++){
  const d = document.createElement('button');
  d.className = 'dot'; d.type = 'button';
  d.setAttribute('aria-label', i === 0 ? '前往封面' : '前往第 ' + i + ' 页');
  d.addEventListener('click', ()=>jump(i));
  dotsEl.appendChild(d);

  const b = document.createElement('button');
  b.type = 'button'; b.className = 'thumb';
  b.title = i === LAST ? '版本页' : PAGES[i].name;
  b.innerHTML = i === LAST ? '<span class="vp">版本</span>'
                           : '<img src="' + PAGES[i].thumb + '" alt="' + PAGES[i].name + '">';
  b.addEventListener('click', ()=>jump(i));
  thumbsEl.appendChild(b);
}
/* 目录 */
const tocEl = $('#toc');
[0,1,2,3,4,5].forEach(i=>{
  const it = document.createElement('button');
  it.className = 'toc-item'; it.type = 'button';
  it.innerHTML = '<img src="' + PAGES[i].thumb + '" alt="' + PAGES[i].name + '">' +
    '<span class="idx">' + (i === 0 ? 'COVER' : '0' + i) + '</span>' +
    '<span class="name">' + PAGES[i].name + '</span>';
  it.addEventListener('click', ()=>jump(i));
  tocEl.appendChild(it);
});

function jump(i){
  if(!pageFlip) return;
  pageFlip.flip(Math.max(0, Math.min(COUNT - 1, i)));   // 引擎自己按跨页/单页对齐
  closeToc();
}
function step(dir){
  if(!pageFlip) return;
  const land = isLandscape();
  let t;
  if(dir > 0){ t = land ? (cur === 0 ? 1 : cur + 2) : cur + 1; }
  else { t = land ? (cur <= 1 ? 0 : cur - 2) : cur - 1; }
  t = Math.max(0, Math.min(COUNT - 1, t));
  if(t !== cur) pageFlip.flip(t);
}
$('#btnNext').addEventListener('click', ()=>step(1));
$('#btnPrev').addEventListener('click', ()=>step(-1));

/* 打开 / 关闭目录 */
const overlay = $('#overlay');
$('#btnToc').addEventListener('click', ()=>overlay.classList.add('on'));
function closeToc(){ overlay.classList.remove('on'); }
overlay.addEventListener('click', e=>{ if(e.target === overlay) closeToc(); });

/* ── 点页面：中间放大，左右边缘翻页（capture 阶段拦截，兼负责阻止引擎的点击翻页）── */
stageEl.addEventListener('click', e=>{
  e.stopPropagation();
  const pg = e.target.closest('.book-page');
  if(!pg) return;
  const r = pg.getBoundingClientRect();
  const rel = (e.clientX - r.left) / r.width;
  if(rel < 0.16){ step(-1); return; }
  if(rel > 0.84){ step(1); return; }
  const idx = parseInt(pg.dataset.idx, 10);
  if(idx < TOTAL) openViewer(idx);
}, true);

/* ── 键盘 ── */
document.addEventListener('keydown', e=>{
  if($('#viewer').classList.contains('on')){
    if(e.key === 'Escape') closeViewer();
    if(e.key === 'ArrowRight') stepViewer(1);
    if(e.key === 'ArrowLeft') stepViewer(-1);
    if(e.key === '0' || e.key.toLowerCase() === 'f') fit();
    return;
  }
  if(e.key === 'Escape') closeToc();
  if(e.key === 'ArrowRight') step(1);
  if(e.key === 'ArrowLeft') step(-1);
  if(e.key === ' '){ e.preventDefault(); step(1); }
  if(e.key.toLowerCase() === 'c') overlay.classList.add('on');
});

/* ── 放大阅读 ── */
const viewer = $('#viewer'), vimg = $('#vimg');
let scale = 1, tx = 0, ty = 0, vIndex = 0;
function applyT(){ vimg.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')'; $('#vlevel').textContent = Math.round(scale*100) + '%'; }
function fit(){
  const iw = vimg.naturalWidth || 1055, ih = vimg.naturalHeight || 1491;
  const availH = window.innerHeight - 108;
  const s = Math.min(window.innerWidth / iw, availH / ih) * 0.98;
  scale = s; tx = (window.innerWidth - iw*s)/2; ty = (availH - ih*s)/2 + 6;
  applyT();
}
function openViewer(i){
  vIndex = i;
  const p = PAGES[i];
  const key = p.src.split('/').pop().replace('.webp','');
  vimg.style.backgroundImage = PH[key] ? 'url(' + PH[key] + ')' : '';
  vimg.style.backgroundSize = 'cover';
  vimg.src = p.src;
  vimg.onload = fit;
  if(vimg.complete) fit();
  viewer.classList.add('on');
  closeToc();
}
function closeViewer(){ viewer.classList.remove('on'); }
function stepViewer(dir){ openViewer((vIndex + dir + TOTAL) % TOTAL); }
function zoomAt(cx, cy, factor){
  const ns = Math.max(0.2, Math.min(8, scale * factor));
  const k = ns / scale;
  tx = cx - k * (cx - tx); ty = cy - k * (cy - ty); scale = ns; applyT();
}
$('#vclose').addEventListener('click', closeViewer);
$('#vprev').addEventListener('click', e=>{ e.stopPropagation(); stepViewer(-1); });
$('#vnext').addEventListener('click', e=>{ e.stopPropagation(); stepViewer(1); });
$('#vin').addEventListener('click', ()=>zoomAt(window.innerWidth/2, window.innerHeight/2, 1.35));
$('#vout').addEventListener('click', ()=>zoomAt(window.innerWidth/2, window.innerHeight/2, 1/1.35));
$('#vfit').addEventListener('click', fit);
viewer.addEventListener('wheel', e=>{ e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 1/1.12); }, {passive:false});
viewer.addEventListener('dblclick', e=>{ e.preventDefault(); zoomAt(e.clientX, e.clientY, scale > 1.6 ? 1/scale : 2.2/scale); });
let dragging = false, lx = 0, ly = 0, pinch = null;
viewer.addEventListener('pointerdown', e=>{
  if(e.target.tagName !== 'IMG') return;
  dragging = true; lx = e.clientX; ly = e.clientY; viewer.classList.add('dragging');
  try{ vimg.setPointerCapture(e.pointerId); }catch(_){}
});
viewer.addEventListener('pointermove', e=>{
  if(!dragging) return;
  tx += e.clientX - lx; ty += e.clientY - ly; lx = e.clientX; ly = e.clientY; applyT();
});
viewer.addEventListener('pointerup', ()=>{ dragging = false; viewer.classList.remove('dragging'); });
viewer.addEventListener('touchstart', e=>{
  if(e.touches.length === 2){
    const a = e.touches[0], b = e.touches[1];
    pinch = {d: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), cx:(a.clientX+b.clientX)/2, cy:(a.clientY+b.clientY)/2, s: scale};
  }
}, {passive:true});
viewer.addEventListener('touchmove', e=>{
  if(e.touches.length === 2 && pinch){
    e.preventDefault();
    const a = e.touches[0], b = e.touches[1];
    const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    zoomAt(pinch.cx, pinch.cy, (pinch.s * d / pinch.d) / scale);
  }
}, {passive:false});

/* ── 启动与自适应 ── */
let rzTimer = null;
function relayout(){
  sizeStage();
  if(pageFlip && pageFlip.update) { try{ pageFlip.update(); }catch(_){} }
  render(); syncShadow();
}
window.addEventListener('resize', ()=>{ clearTimeout(rzTimer); rzTimer = setTimeout(relayout, 160); });
window.addEventListener('orientationchange', ()=>setTimeout(relayout, 320));

sizeStage();
initFlip();
warm(0); warm(1);
render();
</script>
</body>
</html>
